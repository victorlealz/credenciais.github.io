<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b16">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Victor — Delegacia Especializada de Crimes Cibernéticos, Polícia Civil da Paraíba.">
  <title>Victor | DECC · PCPB</title>

  <style>
    @property --border-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    :root {
      color-scheme: dark;
      --background: #050911;
      --surface: #0a1425;
      --text: #f3f9ff;
      --muted: #8faac3;
      --cyan: #52ecff;
      --blue: #3674ff;
      --violet: #af6cff;
      --divider: rgba(115, 172, 214, .17);
      font-family: "Segoe UI Variable", "Segoe UI", "Arial", sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { min-height: 100%; background: var(--background); }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse 46% 37% at 77% 15%, rgba(34, 73, 166, .24), transparent 92%),
        radial-gradient(ellipse 50% 42% at 13% 89%, rgba(79, 21, 126, .18), transparent 90%),
        var(--background);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .30;
      background-image:
        linear-gradient(rgba(67, 143, 216, .10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(67, 143, 216, .10) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 17%, transparent 79%);
      mask-image: radial-gradient(ellipse at center, #000 17%, transparent 79%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: repeating-linear-gradient(180deg, transparent 0 5px, rgba(55, 126, 195, .018) 6px 7px);
    }

    .viewport {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: clamp(22px, 5vw, 70px) 18px;
      isolation: isolate;
    }

    .viewport::before,
    .viewport::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(560px, 85vw);
      height: min(560px, 85vw);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(95px);
    }

    .viewport::before {
      right: -12%;
      top: -28%;
      background: rgba(22, 85, 181, .14);
    }

    .viewport::after {
      left: -22%;
      bottom: -40%;
      background: rgba(130, 58, 218, .10);
    }

    .card-frame {
      position: relative;
      width: min(100%, 900px);
      filter: drop-shadow(0 27px 70px rgba(0, 0, 0, .56));
      perspective: 1500px;
    }

    .card-frame::before,
    .card-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
      background: var(--cyan);
      box-shadow: 0 0 20px rgba(82, 236, 255, .45);
      width: 46px;
      height: 3px;
    }

    .card-frame::before { left: -7px; top: -7px; }
    .card-frame::after { right: -7px; bottom: -7px; background: var(--violet); }

    .id-card {
      --pointer-x: 50%;
      --pointer-y: 50%;
      --rotate-x: 0deg;
      --rotate-y: 0deg;
      position: relative;
      padding: 1px;
      isolation: isolate;
      overflow: hidden;
      clip-path: polygon(0 0, calc(100% - 23px) 0, 100% 23px, 100% calc(100% - 23px), calc(100% - 23px) 100%, 23px 100%, 0 calc(100% - 23px));
      background: conic-gradient(
        from var(--border-angle) at 50% 50%,
        rgba(48, 117, 183, .54) 0deg,
        rgba(94, 240, 255, .92) 55deg,
        rgba(36, 93, 169, .42) 110deg,
        rgba(172, 107, 255, .74) 196deg,
        rgba(31, 88, 148, .48) 275deg,
        rgba(90, 235, 255, .88) 360deg
      );
      transform: rotateX(var(--rotate-x)) rotateY(var(--rotate-y)) translateY(0) scale(1);
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.16, 1, .3, 1), filter .38s ease;
      animation: border-circuit 13s linear infinite;
      will-change: auto;
    }

    .card-inner {
      position: relative;
      min-height: 510px;
      padding: clamp(26px, 5.4vw, 56px);
      overflow: hidden;
      clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% calc(100% - 22px), calc(100% - 22px) 100%, 22px 100%, 0 calc(100% - 22px));
      background:
        radial-gradient(ellipse at 91% 7%, rgba(34, 120, 205, .19), transparent 37%),
        linear-gradient(135deg, rgba(12, 29, 51, .99), rgba(7, 14, 27, .99) 62%, rgba(12, 13, 33, .99));
    }

    .id-card::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: 2;
      pointer-events: none;
      opacity: .5;
      mix-blend-mode: screen;
      background:
        radial-gradient(540px circle at var(--pointer-x) var(--pointer-y), rgba(91, 225, 255, .25), transparent 62%),
        linear-gradient(115deg, transparent 12%, rgba(72, 211, 255, .02) 30%, rgba(162, 92, 255, .13) 47%, rgba(69, 245, 233, .065) 56%, transparent 75%);
      background-size: 100% 100%, 180% 180%;
      transition: opacity .35s ease;
    }

    .id-card::after {
      content: "";
      position: absolute;
      inset: -80% 0 auto;
      z-index: 3;
      height: 42%;
      pointer-events: none;
      opacity: 0;
      transform: translateY(0);
      background: linear-gradient(180deg, transparent, rgba(83, 227, 255, .12), transparent);
    }

    .id-card:hover,
    .id-card:focus-within {
      filter: brightness(1.12) drop-shadow(0 0 25px rgba(60, 190, 255, .18));
    }

    .id-card:hover::before,
    .id-card:focus-within::before { opacity: 1; }

    .id-card:hover::after { opacity: 1; animation: scan-pass 1.25s ease-out both; }

    .topbar,
    .identity,
    .details { position: relative; z-index: 4; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 5vw, 52px);
      padding-bottom: clamp(22px, 4vw, 34px);
      border-bottom: 1px solid var(--divider);
    }

    .pcpb-logo,
    .decc-logo {
      display: block;
      width: auto;
      flex: 0 0 auto;
      object-fit: contain;
      transition: filter .3s ease, transform .3s cubic-bezier(.16, 1, .3, 1);
    }

    .pcpb-logo {
      height: clamp(83px, 11vw, 113px);
      filter: drop-shadow(0 0 14px rgba(219, 178, 67, .15));
    }

    .decc-logo {
      height: clamp(100px, 13vw, 128px);
      filter: drop-shadow(0 0 16px rgba(82, 236, 255, .14));
    }

    .pcpb-logo:hover {
      transform: translateY(-3px) scale(1.045);
      filter: drop-shadow(0 0 18px rgba(237, 197, 78, .34));
    }

    .decc-logo:hover {
      transform: translateY(-3px) scale(1.045);
      filter: drop-shadow(0 0 21px rgba(82, 236, 255, .3));
    }

    .identity {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      border-bottom: 1px solid var(--divider);
    }

    .identity::before {
      content: "";
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 37px;
      height: 3px;
      background: var(--cyan);
      box-shadow: 0 0 17px rgba(82, 236, 255, .66);
    }

    h1 {
      position: relative;
      z-index: 2;
      margin: 14px 0 0;
      min-width: 0;
      font-size: clamp(4.1rem, 9.7vw, 7.1rem);
      line-height: 1;
      letter-spacing: -.087em;
      text-transform: uppercase;
      font-weight: 900;
      color: #f4fbff;
      text-shadow: 0 0 35px rgba(76, 177, 255, .19);
      text-align: center;
    }

    h1::after {
      content: "";
      position: absolute;
      inset: 9% 0;
      pointer-events: none;
      z-index: -1;
      opacity: .19;
      background: linear-gradient(transparent 49%, var(--cyan) 50%, transparent 52%);
      background-size: 100% 12px;
      -webkit-background-clip: text;
      background-clip: text;
    }

    .radar {
      position: absolute;
      top: 50%;
      right: -18px;
      width: 216px;
      aspect-ratio: 1;
      transform: translateY(-50%);
      opacity: .25;
      pointer-events: none;
    }

    .radar svg { width: 100%; height: 100%; }
    .radar .ring { fill: none; stroke: rgba(82, 236, 255, .3); stroke-width: 1; }
    .radar .arc { fill: none; stroke: rgba(137, 122, 255, .64); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 35 18 70 145; transform-origin: center; animation: radar-turn 24s linear infinite; }
    .radar .cross { stroke: rgba(82, 236, 255, .26); stroke-width: 1; }
    .radar .dot { fill: var(--cyan); filter: drop-shadow(0 0 5px var(--cyan)); }

    .details {
      margin: 12px 0 0;
      padding: 0;
    }

    .detail {
      position: relative;
      display: grid;
      grid-template-columns: minmax(140px, 185px) minmax(0, 1fr);
      gap: 22px;
      align-items: center;
      min-height: 71px;
      padding: 16px 12px;
      border-bottom: 1px solid var(--divider);
      transition: background .24s ease, transform .24s ease, box-shadow .24s ease;
    }

    .detail::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      background: linear-gradient(var(--cyan), var(--violet));
      opacity: 0;
      transform: scaleY(.18);
      transition: opacity .2s ease, transform .24s ease;
    }

    .detail:hover,
    .detail:focus-within {
      background: linear-gradient(90deg, rgba(82, 236, 255, .11), rgba(72, 77, 180, .04) 73%, transparent);
      box-shadow: inset 18px 0 28px -30px rgba(82, 236, 255, .9);
      transform: translateX(5px);
    }

    .detail:hover::before,
    .detail:focus-within::before { opacity: 1; transform: scaleY(1); }

    dt {
      color: var(--muted);
      font-size: .69rem;
      font-weight: 800;
      letter-spacing: .11em;
      line-height: 1.6;
      text-transform: uppercase;
    }

    dd {
      margin: 0;
      min-width: 0;
      color: var(--text);
      font-size: .98rem;
      font-weight: 570;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .registration {
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-weight: 700;
      letter-spacing: .045em;
      color: #e9f9ff;
    }

    a {
      color: inherit;
      outline-offset: 5px;
    }

    a:focus-visible {
      outline: 2px solid var(--cyan);
      border-radius: 2px;
    }

    .email {
      display: inline;
      text-decoration: none;
      border-bottom: 1px solid rgba(82, 236, 255, .48);
      transition: color .2s ease, border-color .2s ease, text-shadow .2s ease;
    }

    .email:hover,
    .email:focus-visible {
      color: var(--cyan);
      border-color: var(--cyan);
      text-shadow: 0 0 16px rgba(82, 236, 255, .46);
    }

    .detail-location { border-bottom: 0; padding-bottom: 7px; }

    .map-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      min-height: 43px;
      max-width: 100%;
      padding: 10px 15px;
      border: 1px solid rgba(82, 236, 255, .48);
      background: rgba(82, 236, 255, .07);
      color: var(--cyan);
      text-decoration: none;
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-size: .77rem;
      font-weight: 800;
      letter-spacing: .035em;
      text-transform: uppercase;
      overflow: hidden;
      transition: color .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease, transform .22s ease;
    }

    .map-link::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 10%, rgba(255, 255, 255, .38) 47%, transparent 68%);
      transform: translateX(-165%);
      transition: transform .55s cubic-bezier(.16, 1, .3, 1);
      pointer-events: none;
    }

    .map-link:hover,
    .map-link:focus-visible {
      color: #001521;
      border-color: var(--cyan);
      background: var(--cyan);
      box-shadow: 0 0 0 1px rgba(82, 236, 255, .20), 0 0 24px rgba(82, 236, 255, .38);
      transform: translateY(-2px);
    }

    .map-link:hover::before,
    .map-link:focus-visible::before { transform: translateX(160%); }

    .map-link svg {
      position: relative;
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .map-link span { position: relative; }
    .map-link .arrow { width: 15px; height: 15px; }

    @keyframes border-circuit { to { --border-angle: 360deg; } }
    @keyframes radar-turn { to { transform: rotate(360deg); } }
    @keyframes scan-pass { to { transform: translateY(650%); } }

    @media (hover: hover) and (pointer: fine) {
      .id-card:hover {
        transform: rotateX(var(--rotate-x)) rotateY(var(--rotate-y)) translateY(-6px) scale(1.009);
      }
    }

    @media (max-width: 660px) {
      .card-inner { min-height: 0; padding: 27px 23px 27px; }
      .topbar { gap: clamp(21px, 8vw, 42px); padding-bottom: 23px; }
      .pcpb-logo { height: clamp(78px, 22vw, 96px); }
      .decc-logo { height: clamp(92px, 26vw, 111px); }
      .identity { min-height: 124px; }
      .identity::before { top: 14px; }
      h1 { font-size: clamp(3rem, 13.4vw, 6.1rem); margin-top: 12px; }
      .radar { width: 165px; right: -56px; opacity: .19; }
      .detail { grid-template-columns: 1fr; gap: 4px; padding: 14px 9px; min-height: 66px; }
      dt { font-size: .66rem; }
      dd { font-size: .93rem; }
      .detail-location { padding-top: 17px; }
    }

    @media (max-width: 370px) {
      .viewport { padding-inline: 12px; }
      .card-inner { padding-inline: 18px; }
      .topbar { gap: 20px; }
      .pcpb-logo { height: 72px; }
      .decc-logo { height: 83px; }
      h1 { font-size: clamp(2.9rem, 13vw, 3.2rem); }
      .map-link { width: 100%; gap: 8px; font-size: .72rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
      .id-card { transform: none !important; }
      .detail:hover, .detail:focus-within { transform: none; }
      .pcpb-logo:hover, .decc-logo:hover { transform: none; }
    }
  </style>
</head>

  <script>
    (() => {
      const card = document.querySelector('.id-card');
      const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (!card || !finePointer.matches || reducedMotion.matches) return;

      let animationFrame = 0;
      card.addEventListener('pointermove', (event) => {
        const rect = card.getBoundingClientRect();
        const x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
        const y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(() => {
          card.style.setProperty('--pointer-x', `${(x * 100).toFixed(2)}%`);
          card.style.setProperty('--pointer-y', `${(y * 100).toFixed(2)}%`);
          card.style.setProperty('--rotate-x', `${((.5 - y) * 7).toFixed(2)}deg`);
          card.style.setProperty('--rotate-y', `${((x - .5) * 9).toFixed(2)}deg`);
        });
      }, { passive: true });

      card.addEventListener('pointerleave', () => {
        cancelAnimationFrame(animationFrame);
        card.style.setProperty('--pointer-x', '50%');
        card.style.setProperty('--pointer-y', '50%');
        card.style.setProperty('--rotate-x', '0deg');
        card.style.setProperty('--rotate-y', '0deg');
      });
    })();
  </script>
